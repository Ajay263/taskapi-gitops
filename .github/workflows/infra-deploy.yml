name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - 'taskapi-gitops/ansible/**'
      - 'taskapi-gitops/infrastructure/**'
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Which playbook to run'
        required: true
        default: 'verify'
        type: choice
        options:
          - site
          - vault
          - monitoring
          - argocd
          - keycloak
          - security
          - verify
      check_mode:
        description: 'Dry run only?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  lint:
    name: "🔍 Ansible Lint"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible ansible-lint --break-system-packages

      - name: Install collections
        run: ansible-galaxy collection install kubernetes.core community.general

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: ansible-lint playbooks/site.yaml
        continue-on-error: true

  deploy:
    name: "🚀 Run Ansible Playbook"
    runs-on: self-hosted
    needs: lint
    defaults:
      run:
        working-directory: taskapi-gitops/ansible

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install ansible jmespath kubernetes --break-system-packages

      - name: Install Ansible collections
        run: ansible-galaxy collection install kubernetes.core community.general

      - name: Setup kubeconfig for runner
        run: |
          mkdir -p $HOME/.kube
          # Export kubeconfig from KinD cluster
          kind export kubeconfig --name taskapi-local
          CONTROL_PLANE_IP=$(docker inspect taskapi-local-control-plane --format='{{.NetworkSettings.Networks.kind.IPAddress}}')
          sed -i "s|https://127.0.0.1:[0-9]*|https://${CONTROL_PLANE_IP}:6443|g" $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          kubectl cluster-info
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV --kubeconfig $HOME/.kube/config
          # Verify connectivity
          kubectl cluster-info
          kubectl get nodes

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Select playbook
        id: playbook
        run: |
          PLAYBOOK="${{ github.event.inputs.playbook || 'verify' }}"
          echo "name=${PLAYBOOK}" >> $GITHUB_OUTPUT

      - name: Run Ansible playbook
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
          KUBECONFIG: ${{ env.HOME }}/.kube/config
        run: |
          CHECK_FLAG=""
          if [ "${{ github.event.inputs.check_mode }}" = "true" ]; then
            CHECK_FLAG="--check --diff"
          fi
          ansible-playbook playbooks/${{ steps.playbook.outputs.name }}.yaml \
            -e "ansible_python_interpreter=$(which python3)" \
            $CHECK_FLAG -v

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ Ansible playbook *${{ steps.playbook.outputs.name }}* succeeded\nCommit: ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ Ansible playbook *${{ steps.playbook.outputs.name }}* FAILED\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
