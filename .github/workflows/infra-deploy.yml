---
- name: Add HashiCorp Helm repo
  command: helm repo add hashicorp https://helm.releases.hashicorp.com
  changed_when: false

- name: Update Helm repos
  command: helm repo update
  changed_when: false

- name: Create vault namespace
  command: kubectl create namespace vault
  register: create_namespace
  changed_when: create_namespace.rc == 0
  failed_when: create_namespace.rc != 0 and "AlreadyExists" not in create_namespace.stderr

- name: Install Vault via Helm
  command: |
    helm upgrade --install vault hashicorp/vault \
      --namespace vault \
      --set server.dev.enabled=true \
      --set server.dev.devRootToken=root \
      --set server.nodeSelector.workload=infra \
      --set server.resources.requests.memory=128Mi \
      --set server.resources.requests.cpu=100m \
      --set server.resources.limits.memory=256Mi \
      --set server.resources.limits.cpu=200m \
      --set injector.enabled=false \
      --wait \
      --timeout 120s
  register: helm_install
  changed_when: "'UPGRADE' in helm_install.stdout or 'INSTALL' in helm_install.stdout"

- name: Wait for Vault pod to be ready
  command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vault -n vault --timeout=120s
  register: wait_pod
  changed_when: false
  until: wait_pod.rc == 0
  retries: 3
  delay: 10

- name: Verify Vault is working
  command: kubectl exec -n vault vault-0 -- vault status
  register: vault_status
  changed_when: false
  until: vault_status.rc == 0
  retries: 30
  delay: 10

- name: Display Vault status
  debug:
    msg: |
      Vault Status:
      {{ vault_status.stdout_lines }}

# Port-forward is optional - only needed for local testing
# For CI/CD, we skip it as it's not required
- name: Start port-forward to Vault (for local development only)
  shell: |
    pkill -f "port-forward.*vault.*8200" 2>/dev/null || true
    nohup kubectl port-forward -n vault svc/vault 8200:8200 > /tmp/vault-port-forward.log 2>&1 &
    sleep 5
  when: ansible_env.CI is not defined or ansible_env.CI != "true"
  changed_when: false
  ignore_errors: yes