name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - 'taskapi-gitops/ansible/**'
      - 'taskapi-gitops/infrastructure/**'
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Which playbook to run'
        required: true
        default: 'verify'
        type: choice
        options:
          - site
          - vault
          - monitoring
          - argocd
          - keycloak
          - security
          - verify

jobs:
  lint:
    name: "🔍 Ansible Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Install Ansible
        run: pip install ansible ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install kubernetes.core community.general
      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
      - name: Run ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: ansible-lint playbooks/site.yaml
        continue-on-error: true

  deploy:
    name: "🚀 Deploy on Azure VM"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm-key.pem
          chmod 600 ~/.ssh/vm-key.pem
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy latest code to VM
        run: |
          ssh -i ~/.ssh/vm-key.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'SSHEOF'
            git config --global --add safe.directory /home/azureuser/taskapi-gitops
            cd /home/azureuser/taskapi-gitops
            git pull origin main
          SSHEOF


      - name: Run Ansible playbook on VM
        run: |
          PLAYBOOK="${{ github.event.inputs.playbook || 'verify' }}"
          ssh -i ~/.ssh/vm-key.pem ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}             "sg docker -c 'cd /home/azureuser/taskapi-gitops/taskapi-gitops/ansible &&              ansible-playbook playbooks/${PLAYBOOK}.yaml                -e ansible_python_interpreter=/usr/bin/python3                -e kind_cluster_name=taskapi-local                -e cluster_name=taskapi-local                -e github_token=${{ secrets.GITOPS_PAT }}                -v'"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ Infrastructure deploy succeeded on Azure VM\nPlaybook: ${{ github.event.inputs.playbook || 'verify' }}\nCommit: ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ Infrastructure deploy FAILED on Azure VM\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
