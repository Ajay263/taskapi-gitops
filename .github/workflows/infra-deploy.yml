name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Which playbook to run'
        required: true
        default: 'verify'
        type: choice
        options:
          - site
          - vault
          - monitoring
          - argocd
          - keycloak
          - security
          - verify

jobs:
  lint:
    name: "🔍 Ansible Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install kubernetes.core community.general
      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
      - name: Run ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: ansible-lint playbooks/site.yaml
        continue-on-error: true

  deploy:
    name: "🚀 Deploy Full Infrastructure"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: taskapi-gitops/ansible

    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages and Ansible
        run: |
          pip install ansible jmespath kubernetes
          ansible-galaxy collection install kubernetes.core community.general

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install KinD
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/
          argocd version --client

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run Ansible playbook
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: |
          ansible-playbook playbooks/${{ github.event.inputs.playbook }}.yaml \
            -e "ansible_python_interpreter=$(which python3)" \
            -e "kind_cluster_name=taskapi-local" \
            -e "cluster_name=taskapi-local" \
            -v

      - name: Show cluster status
        if: always()
        run: |
          kubectl get nodes 2>/dev/null || echo "No cluster"
          kubectl get pods -A 2>/dev/null | grep -v Running | grep -v Completed || echo "All pods running"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ Infrastructure *${{ github.event.inputs.playbook }}* succeeded on GitHub Actions\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ Infrastructure *${{ github.event.inputs.playbook }}* FAILED\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
