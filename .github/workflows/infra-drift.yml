name: Infrastructure Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  detect-drift:
    name: "🔎 Detect Configuration Drift"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install ansible jmespath kubernetes --break-system-packages

      - name: Install collections
        run: ansible-galaxy collection install kubernetes.core community.general

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          kind export kubeconfig --name taskapi-local
          CONTROL_PLANE_IP=$(docker inspect taskapi-local-control-plane --format='{{.NetworkSettings.Networks.kind.IPAddress}}')
          sed -i "s|https://127.0.0.1:[0-9]*|https://${CONTROL_PLANE_IP}:6443|g" $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          kubectl cluster-info
          kubectl cluster-info

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run Ansible verify in check mode
        id: drift
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
          KUBECONFIG: ${{ env.HOME }}/.kube/config
        run: |
          ansible-playbook playbooks/verify.yaml \
            -e "ansible_python_interpreter=$(which python3)" \
            --check --diff -v 2>&1 | tee /tmp/drift-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Open GitHub Issue if drift detected
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/drift-report.txt', 'utf8').slice(-3000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Infrastructure Drift Detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Drift Detected\n\nAnsible found differences between Git and cluster state.\n\n### Report\n\`\`\`\n${report}\n\`\`\``,
              labels: ['infrastructure', 'drift']
            });

      - name: Notify Slack if drift found
        if: steps.drift.outputs.exit_code != '0'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "🚨 Infrastructure drift detected!\n${{ github.server_url }}/${{ github.repository }}/issues"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
