name: Vault Recovery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you recovering Vault?'
        required: true
        default: 'Codespace restart — Vault lost in-memory data'

jobs:
  recover:
    name: "🔐 Recover Vault"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install ansible jmespath kubernetes --break-system-packages

      - name: Install collections
        run: ansible-galaxy collection install kubernetes.core community.general

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          kind export kubeconfig --name taskapi-local
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV --kubeconfig $HOME/.kube/config
          kubectl cluster-info

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run Vault recovery
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
          KUBECONFIG: ${{ env.HOME }}/.kube/config
        run: |
          ansible-playbook playbooks/vault.yaml \
            -e "ansible_python_interpreter=$(which python3)" -v

      - name: Verify after recovery
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
          KUBECONFIG: ${{ env.HOME }}/.kube/config
        run: |
          ansible-playbook playbooks/verify.yaml \
            -e "ansible_python_interpreter=$(which python3)" -v
