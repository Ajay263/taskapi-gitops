name: Vault Recovery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you recovering Vault?'
        required: true
        default: 'Codespace restart — Vault lost in-memory data'

jobs:
  recover:
    name: "🔐 Recover Vault"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskapi-gitops/ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install ansible jmespath kubernetes
          ansible-galaxy collection install kubernetes.core community.general

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run Vault recovery
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: |
          ansible-playbook playbooks/vault.yaml \
            -e "ansible_python_interpreter=$(which python3)" -v

      - name: Verify after recovery
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: |
          ansible-playbook playbooks/verify.yaml \
            -e "ansible_python_interpreter=$(which python3)" -v
