apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskapi-prod
resources:
  - ../../base
  - poddisruptionbudget.yaml
  - service-bluegreen.yaml
patches:
  - path: patches/ingress-patch.yaml
    target:
      kind: Ingress
      name: taskapi-ingress
  - path: patches/deployment-patch.yaml
    target:
      kind: Deployment
      name: taskapi
  - path: patches/external-secret-patch.yaml
    target:
      kind: ExternalSecret
      name: taskapi-secrets
images:
  - name: ghcr.io/ajay263/taskapi
    newName: ghcr.io/ajay263/taskapi
    newTag: latest
  - name: taskapi
    newName: ghcr.io/ajay263/taskapi
    newTag: latest
