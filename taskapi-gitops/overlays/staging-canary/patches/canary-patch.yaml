apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: taskapi
        track: canary
        environment: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: taskapi
          env:
            - name: ENVIRONMENT
              value: "staging-canary"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
