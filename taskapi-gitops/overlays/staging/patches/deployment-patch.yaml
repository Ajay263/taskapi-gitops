apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
spec:
  replicas: 2
  template:
    metadata:
      labels:
        environment: staging
        track: stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: taskapi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: taskapi
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
