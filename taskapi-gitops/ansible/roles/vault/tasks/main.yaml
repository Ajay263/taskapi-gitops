---
- name: Add HashiCorp Helm repo
  ansible.builtin.command: helm repo add hashicorp https://helm.releases.hashicorp.com
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Create vault namespace
  ansible.builtin.command: kubectl create namespace vault
  register: vault_create_ns
  changed_when: vault_create_ns.rc == 0
  failed_when: vault_create_ns.rc != 0 and "already exists" not in vault_create_ns.stderr

- name: Install Vault via Helm
  ansible.builtin.shell: >
    helm upgrade --install vault hashicorp/vault
    --namespace vault
    --set server.dev.enabled=true
    --set server.dev.devRootToken=root
    --set injector.enabled=false
    --set server.resources.requests.memory=128Mi
    --set server.resources.requests.cpu=100m
    --set server.resources.limits.memory=256Mi
    --set server.resources.limits.cpu=200m
    --wait
    --timeout 600s
  register: vault_helm_install
  changed_when: "'UPGRADE' in vault_helm_install.stdout or 'INSTALL' in vault_helm_install.stdout"

- name: Wait for Vault pod to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=ready pod
    -l app.kubernetes.io/name=vault
    -n vault --timeout=600s
  register: vault_wait_pod
  changed_when: false
  until: vault_wait_pod.rc == 0
  retries: 3
  delay: 10

- name: Verify Vault is working
  ansible.builtin.command: kubectl exec -n vault vault-0 -- vault status
  register: vault_status
  changed_when: false
  until: vault_status.rc == 0
  retries: 30
  delay: 10

- name: Display Vault status
  ansible.builtin.debug:
    msg: "{{ vault_status.stdout_lines }}"

- name: Configure Vault Kubernetes auth
  ansible.builtin.shell: |
    kubectl port-forward -n vault svc/vault 8200:8200 &
    PF_PID=$!
    sleep 5
    export VAULT_ADDR=http://127.0.0.1:8200
    export VAULT_TOKEN=root
    vault auth enable kubernetes 2>/dev/null || true
    vault write auth/kubernetes/config kubernetes_host="https://kubernetes.default.svc.cluster.local:443"
    vault policy write taskapi-dev - <<EOF
    path "secret/data/taskapi/dev" { capabilities = ["read"] }
    path "secret/metadata/taskapi/dev" { capabilities = ["read", "list"] }
    EOF
    vault policy write taskapi-staging - <<EOF
    path "secret/data/taskapi/staging" { capabilities = ["read"] }
    EOF
    vault policy write taskapi-prod - <<EOF
    path "secret/data/taskapi/prod" { capabilities = ["read"] }
    EOF
    vault kv put secret/taskapi/dev db-password="dev-$(openssl rand -hex 8)" api-key="dev-api-$(openssl rand -hex 12)"
    vault kv put secret/taskapi/staging db-password="staging-$(openssl rand -hex 8)" api-key="staging-api-$(openssl rand -hex 12)"
    vault kv put secret/taskapi/prod db-password="prod-$(openssl rand -hex 8)" api-key="prod-api-$(openssl rand -hex 12)"
    vault write auth/kubernetes/role/taskapi-dev bound_service_account_names=taskapi bound_service_account_namespaces=taskapi-dev policies=taskapi-dev ttl=24h
    vault write auth/kubernetes/role/taskapi-staging bound_service_account_names=taskapi bound_service_account_namespaces=taskapi-staging policies=taskapi-staging ttl=1h
    vault write auth/kubernetes/role/taskapi-prod bound_service_account_names=taskapi bound_service_account_namespaces=taskapi-prod policies=taskapi-prod ttl=1h
    kill $PF_PID 2>/dev/null || true
  changed_when: true
  environment:
    HOME: "{{ ansible_env.HOME }}"

- name: Show Vault configuration complete
  ansible.builtin.debug:
    msg: "✅ Vault installed and configured with dev/staging/prod secrets"
