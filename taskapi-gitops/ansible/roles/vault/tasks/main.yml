---
- name: Add HashiCorp Helm repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com

- name: Create vault namespace
  kubernetes.core.k8s:
    name: vault
    api_version: v1
    kind: Namespace
    state: present

- name: Install Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    values:
      server:
        dev:
          enabled: true
          devRootToken: "root"
        nodeSelector:
          workload: infra
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
    wait: true
    wait_condition:
      type: Available
    timeout: "120s"

- name: Wait for Vault pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: vault
    label_selectors:
      - app.kubernetes.io/name=vault
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120

- name: Start port-forward to Vault
  ansible.builtin.shell: |
    pkill -f "port-forward.*vault.*8200" 2>/dev/null || true
    kubectl port-forward -n vault svc/vault 8200:8200 &
    sleep 5
    echo $!
  register: vault_pf
  changed_when: false

- name: Enable Kubernetes auth method
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/auth/kubernetes"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: kubernetes
    status_code: [200, 204, 400]
  register: vault_auth
  changed_when: vault_auth.status in [200, 204]

- name: Configure Kubernetes auth
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/kubernetes/config"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      kubernetes_host: "https://kubernetes.default.svc.cluster.local:443"
    status_code: [200, 204]

- name: Write Vault policies
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/{{ item.name }}"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      policy: "{{ item.policy }}"
    status_code: [200, 204]
  loop:
    - name: taskapi-dev
      policy: |
        path "secret/data/taskapi/dev" { capabilities = ["read"] }
        path "secret/metadata/taskapi/dev" { capabilities = ["read", "list"] }
    - name: taskapi-staging
      policy: |
        path "secret/data/taskapi/staging" { capabilities = ["read"] }
        path "secret/metadata/taskapi/staging" { capabilities = ["read", "list"] }
    - name: taskapi-prod
      policy: |
        path "secret/data/taskapi/prod" { capabilities = ["read"] }
        path "secret/metadata/taskapi/prod" { capabilities = ["read", "list"] }

- name: Write application secrets
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/taskapi/{{ item }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      data:
        db-password: "{{ item }}-{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"
        api-key: "{{ item }}-api-{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
    status_code: [200, 204]
  loop:
    - dev
    - staging
    - prod

- name: Create Kubernetes auth roles
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/kubernetes/role/taskapi-{{ item.env }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      bound_service_account_names: taskapi
      bound_service_account_namespaces: "taskapi-{{ item.env }}"
      policies: "taskapi-{{ item.env }}"
      ttl: "{{ item.ttl }}"
    status_code: [200, 204]
  loop:
    - env: dev
      ttl: 24h
    - env: staging
      ttl: 1h
    - env: prod
      ttl: 1h

- name: Verify Vault configuration
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/kubernetes/role/taskapi-dev"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: 200
  register: vault_verify

- name: Show Vault role status
  ansible.builtin.debug:
    msg: "✅ Vault role taskapi-dev configured: bound to {{ vault_verify.json.data.bound_service_account_namespaces }}"
