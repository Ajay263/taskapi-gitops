---
- name: Add External Secrets Helm repo
  ansible.builtin.command: >
    helm repo add external-secrets https://charts.external-secrets.io
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install External Secrets Operator
  ansible.builtin.command: >
    helm upgrade --install external-secrets
    external-secrets/external-secrets
    --namespace external-secrets
    --create-namespace
    --version 0.9.20
    --set installCRDs=true
    --wait
    --timeout 600s
  register: eso_install
  changed_when: eso_install.rc == 0

- name: Wait for ESO to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment/external-secrets
    --namespace=external-secrets --timeout=600s
  changed_when: false

- name: Verify ESO is running
  ansible.builtin.command: >
    kubectl get pods -n external-secrets --no-headers
  register: eso_pods
  changed_when: false


- name: Get Vault root token
  ansible.builtin.command: >
    python3 -c "import json; d=json.load(open('/home/azureuser/.vault-init.json')); print(d['root_token'])"
  register: vault_token
  changed_when: false
  failed_when: false

- name: Create Vault token secret for ESO
  ansible.builtin.shell: |
    kubectl create secret generic vault-token       --namespace external-secrets       --from-literal=token={{ vault_token.stdout | trim }}       --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true
  when: vault_token.rc == 0

- name: Create ClusterSecretStore for Vault
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: external-secrets.io/v1beta1
    kind: ClusterSecretStore
    metadata:
      name: vault-backend
    spec:
      provider:
        vault:
          server: "http://vault.vault.svc.cluster.local:8200"
          path: "secret"
          version: "v2"
          auth:
            kubernetes:
              mountPath: "kubernetes"
              role: "external-secrets"
              serviceAccountRef:
                name: "external-secrets"
                namespace: "external-secrets"
    EOF
  args:
    executable: /bin/bash
  changed_when: true

- name: Wait for ClusterSecretStore to be ready
  ansible.builtin.command: >
    kubectl get clustersecretstore vault-backend
    -o jsonpath="{.status.conditions[0].status}"
  register: css_status
  until: css_status.stdout == "True"
  retries: 10
  delay: 10
  changed_when: false
  failed_when: false

- name: Show ESO pods
  ansible.builtin.debug:
    msg: "{{ eso_pods.stdout_lines }}"
