---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  become: true

- name: Install MetalLB
  ansible.builtin.shell: |
    kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.13.12/config/manifests/metallb-native.yaml
  changed_when: false

- name: Wait for MetalLB controller
  ansible.builtin.command: >
    kubectl wait --for=condition=ready pod
    -l app=metallb,component=controller
    -n metallb-system --timeout=90s
  changed_when: false
  failed_when: false

- name: Get KinD network subnet
  ansible.builtin.shell: |
    docker network inspect kind | python3 -c "
    import json,sys
    d=json.load(sys.stdin)
    for n in d:
        for c in n.get('IPAM',{}).get('Config',[]):
            s = c.get('Subnet','')
            if '172.' in s:
                print(s)
    "
  register: kind_subnet
  changed_when: false

- name: Configure MetalLB IP pool
  ansible.builtin.shell: |
    kubectl apply -f - << 'YAML'
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: kind-pool
      namespace: metallb-system
    spec:
      addresses:
        - 172.18.255.200-172.18.255.250
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: kind-l2
      namespace: metallb-system
    spec:
      ipAddressPools:
        - kind-pool
    YAML
  changed_when: false

- name: Patch NGINX ingress to use LoadBalancer
  ansible.builtin.shell: |
    kubectl patch svc ingress-nginx-controller \
      -n ingress-nginx \
      --type=merge \
      -p '{"spec":{"type":"LoadBalancer"}}'
  changed_when: false
  failed_when: false

- name: Wait for NGINX ingress LoadBalancer IP
  ansible.builtin.shell: |
    kubectl get svc ingress-nginx-controller \
      -n ingress-nginx \
      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: ingress_lb_ip
  until: ingress_lb_ip.stdout != ""
  retries: 20
  delay: 5
  changed_when: false

- name: Show ingress LoadBalancer IP
  ansible.builtin.debug:
    msg: "NGINX Ingress LoadBalancer IP: {{ ingress_lb_ip.stdout }}"

- name: Patch Grafana to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc kube-prometheus-stack-grafana \
      -n monitoring --type=merge \
      -p '{"spec":{"type":"ClusterIP","nodePort":null}}'
  changed_when: false
  failed_when: false

- name: Patch Prometheus to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc kube-prometheus-stack-prometheus \
      -n monitoring --type=json \
      -p='[{"op":"replace","path":"/spec/type","value":"ClusterIP"},{"op":"remove","path":"/spec/ports/0/nodePort"}]'
  changed_when: false
  failed_when: false

- name: Patch Alertmanager to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc kube-prometheus-stack-alertmanager \
      -n monitoring --type=json \
      -p='[{"op":"replace","path":"/spec/type","value":"ClusterIP"},{"op":"remove","path":"/spec/ports/0/nodePort"}]'
  changed_when: false
  failed_when: false

- name: Patch Vault to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc vault -n vault --type=merge \
      -p '{"spec":{"type":"ClusterIP"}}'
  changed_when: false
  failed_when: false

- name: Patch Keycloak to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc keycloak -n iam --type=merge \
      -p '{"spec":{"type":"ClusterIP"}}'
  changed_when: false
  failed_when: false

- name: Patch ArgoCD to ClusterIP
  ansible.builtin.shell: |
    kubectl patch svc argocd-server -n argocd --type=merge \
      -p '{"spec":{"type":"ClusterIP"}}'
  changed_when: false
  failed_when: false

- name: Apply all service ingress manifests
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../infrastructure/ingress/ingress-all-services.yaml
  changed_when: false
  failed_when: false

- name: Configure nginx reverse proxy to LoadBalancer IP
  ansible.builtin.template:
    src: k8s-proxy.conf.j2
    dest: /etc/nginx/sites-available/k8s-proxy
    mode: '0644'
  vars:
    nginx_ingress_ip: "{{ ingress_lb_ip.stdout }}"
  become: true
  notify: restart nginx

- name: Enable k8s-proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/k8s-proxy
    dest: /etc/nginx/sites-enabled/k8s-proxy
    state: link
  become: true
  notify: restart nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: restart nginx

- name: Test nginx config
  ansible.builtin.command: nginx -t
  become: true
  changed_when: false

- name: Start and enable nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Show service URLs
  ansible.builtin.debug:
    msg:
      - "TaskAPI:      http://{{ ansible_host }}/api/health"
      - "Grafana:      http://{{ ansible_host }}/grafana/"
      - "Prometheus:   http://{{ ansible_host }}/prometheus/"
      - "Alertmanager: http://{{ ansible_host }}/alertmanager/"
      - "ArgoCD:       http://{{ ansible_host }}/argocd/"
      - "Keycloak:     http://{{ ansible_host }}/keycloak/"
      - "Vault:        http://{{ ansible_host }}/vault/ui/"
