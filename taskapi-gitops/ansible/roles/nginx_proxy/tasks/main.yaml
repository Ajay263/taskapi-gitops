---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  become: true

- name: Get NGINX ingress NodePort
  ansible.builtin.shell: |
    kubectl get svc ingress-nginx-controller -n ingress-nginx \
      -o jsonpath='{.spec.ports[?(@.port==80)].nodePort}'
  register: nginx_nodeport
  changed_when: false

- name: Get KinD worker node IP
  ansible.builtin.shell: |
    docker inspect taskapi-local-worker \
      --format='{{ "{{" }}.NetworkSettings.Networks.kind.IPAddress{{ "}}" }}'
  register: kind_node_ip_raw
  changed_when: false

- name: Set KinD node IP fact
  ansible.builtin.set_fact:
    kind_node_ip: "{{ kind_node_ip_raw.stdout | trim }}"

- name: Show KinD node IP
  ansible.builtin.debug:
    msg: "KinD node IP: {{ kind_node_ip }}"

- name: Patch Prometheus to NodePort
  ansible.builtin.shell: |
    kubectl patch svc kube-prometheus-stack-prometheus \
      -n monitoring \
      --type='json' \
      -p='[{"op":"replace","path":"/spec/type","value":"NodePort"},
           {"op":"add","path":"/spec/ports/0/nodePort","value":30090}]'
  changed_when: false
  failed_when: false

- name: Patch Alertmanager to NodePort
  ansible.builtin.shell: |
    kubectl patch svc kube-prometheus-stack-alertmanager \
      -n monitoring \
      --type='json' \
      -p='[{"op":"replace","path":"/spec/type","value":"NodePort"},
           {"op":"add","path":"/spec/ports/0/nodePort","value":30093}]'
  changed_when: false
  failed_when: false

- name: Patch Vault to NodePort
  ansible.builtin.shell: |
    kubectl patch svc vault \
      -n vault \
      --type='json' \
      -p='[{"op":"replace","path":"/spec/type","value":"NodePort"},
           {"op":"add","path":"/spec/ports/0/nodePort","value":30200}]'
  changed_when: false
  failed_when: false

- name: Configure nginx reverse proxy
  ansible.builtin.template:
    src: k8s-proxy.conf.j2
    dest: /etc/nginx/sites-available/k8s-proxy
    mode: '0644'
  become: true
  notify: restart nginx

- name: Enable k8s-proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/k8s-proxy
    dest: /etc/nginx/sites-enabled/k8s-proxy
    state: link
  become: true
  notify: restart nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: restart nginx

- name: Test nginx config
  ansible.builtin.command: nginx -t
  become: true
  changed_when: false

- name: Start and enable nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Delete existing taskapi ingress if exists
  ansible.builtin.command: kubectl delete ingress taskapi -n taskapi-dev
  failed_when: false
  changed_when: false

- name: Apply all service ingress manifests
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../infrastructure/ingress/ingress-all-services.yaml
  changed_when: false

- name: Verify all services accessible
  ansible.builtin.shell: |
    VM_IP=$(curl -s ifconfig.me)
    echo "=== Service URLs ==="
    echo "TaskAPI:      http://$VM_IP/api/health"
    echo "Grafana:      http://$VM_IP/grafana/"
    echo "Prometheus:   http://$VM_IP/prometheus/"
    echo "Alertmanager: http://$VM_IP/alertmanager/"
    echo "ArgoCD:       http://$VM_IP/argocd/"
    echo "Keycloak:     http://$VM_IP/keycloak/"
    echo "Vault:        http://$VM_IP/vault/"
  register: service_urls
  changed_when: false

- name: Show service URLs
  ansible.builtin.debug:
    msg: "{{ service_urls.stdout_lines }}"
