---
- name: Create IAM namespace
  ansible.builtin.command: kubectl create namespace iam
  register: iam_ns
  changed_when: iam_ns.rc == 0
  failed_when: iam_ns.rc != 0 and "already exists" not in iam_ns.stderr

- name: Deploy Keycloak
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../infrastructure/iam/keycloak.yaml
  changed_when: false

- name: Wait for Keycloak to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment/keycloak
    --namespace=iam --timeout=300s
  changed_when: false

- name: Start Keycloak port-forward
  ansible.builtin.shell: |
    pkill -f "port-forward.*keycloak.*8888" 2>/dev/null || true
    kubectl port-forward -n iam svc/keycloak 8888:8080 &
    sleep 15
  changed_when: false

- name: Wait for Keycloak HTTP endpoint
  ansible.builtin.uri:
    url: "http://localhost:8888/realms/master"
    status_code: 200
  register: kc_health
  until: kc_health.status == 200
  retries: 30
  delay: 10

- name: Get Keycloak admin token
  ansible.builtin.uri:
    url: "http://localhost:8888/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: admin
      password: admin123
      grant_type: password
      client_id: admin-cli
    status_code: 200
  register: keycloak_token
  no_log: true

- name: Create taskapi realm
  ansible.builtin.uri:
    url: "http://localhost:8888/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      realm: taskapi
      enabled: true
      displayName: "TaskAPI Platform"
      accessTokenLifespan: 300
    status_code: [201, 409]

- name: Create Keycloak groups
  ansible.builtin.uri:
    url: "http://localhost:8888/admin/realms/taskapi/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      name: "{{ item }}"
    status_code: [201, 409]
  loop:
    - dev-team
    - ops-team
    - platform-eng
    - readonly

- name: Create Kubernetes OIDC client
  ansible.builtin.uri:
    url: "http://localhost:8888/admin/realms/taskapi/clients"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      clientId: kubernetes
      enabled: true
      protocol: openid-connect
      publicClient: false
      secret: kubernetes-client-secret
      directAccessGrantsEnabled: true
      redirectUris: ["*"]
    status_code: [201, 409]

- name: Show Keycloak status
  ansible.builtin.debug:
    msg: "✅ Keycloak configured with taskapi realm and OIDC client"
