---
- name: Create IAM namespace
  kubernetes.core.k8s:
    name: iam
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy Keycloak
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../infrastructure/iam/keycloak.yaml"

- name: Wait for Keycloak to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: keycloak
    namespace: iam
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Start Keycloak port-forward
  ansible.builtin.shell: |
    pkill -f "port-forward.*keycloak.*8888" 2>/dev/null || true
    kubectl port-forward -n iam svc/keycloak 8888:8080 &
    sleep 10
  changed_when: false

- name: Wait for Keycloak HTTP endpoint
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/realms/master"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 10

- name: Get Keycloak admin token
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ keycloak_admin_user }}"
      password: "{{ keycloak_admin_password }}"
      grant_type: password
      client_id: admin-cli
    status_code: 200
  register: keycloak_token
  no_log: true

- name: Create taskapi realm
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      realm: "{{ keycloak_realm }}"
      enabled: true
      displayName: "TaskAPI Platform"
      accessTokenLifespan: 300
    status_code: [201, 409]
  no_log: false

- name: Create Keycloak groups
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      name: "{{ item }}"
    status_code: [201, 409]
  loop:
    - dev-team
    - ops-team
    - platform-eng
    - readonly

- name: Create Keycloak users
  ansible.builtin.include_tasks: create_user.yaml
  loop:
    - username: alice
      firstName: Alice
      lastName: Dev
      email: alice@taskapi.dev
      password: alice123
      groups: [dev-team]
    - username: bob
      firstName: Bob
      lastName: Dev
      email: bob@taskapi.dev
      password: bob123
      groups: [dev-team]
    - username: charlie
      firstName: Charlie
      lastName: Ops
      email: charlie@taskapi.ops
      password: charlie123
      groups: [ops-team, dev-team]
    - username: diana
      firstName: Diana
      lastName: Platform
      email: diana@taskapi.platform
      password: diana123
      groups: [platform-eng]
    - username: eve
      firstName: Eve
      lastName: Readonly
      email: eve@taskapi.dev
      password: eve123
      groups: [readonly]
  loop_control:
    loop_var: user_item

- name: Create Kubernetes OIDC client
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/clients"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    body_format: json
    body:
      clientId: kubernetes
      enabled: true
      protocol: openid-connect
      publicClient: false
      secret: kubernetes-client-secret
      directAccessGrantsEnabled: true
      redirectUris: ["*"]
    status_code: [201, 409]
