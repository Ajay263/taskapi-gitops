---
- name: Create IAM namespace
  ansible.builtin.command: kubectl create namespace iam
  register: iam_ns
  changed_when: iam_ns.rc == 0
  failed_when: iam_ns.rc != 0 and "already exists" not in iam_ns.stderr

- name: Deploy Keycloak
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../infrastructure/iam/keycloak.yaml
  changed_when: false

- name: Wait for Keycloak to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment/keycloak
    --namespace=iam --timeout=300s
  changed_when: false

- name: Configure Keycloak via kcadm.sh inside pod
  ansible.builtin.shell: |
    POD=$(kubectl get pods -n iam -l app=keycloak -o jsonpath="{.items[0].metadata.name}")
    kubectl exec -n iam $POD -- /opt/keycloak/bin/kcadm.sh config credentials \
      --server http://localhost:8080 --realm master \
      --user admin --password admin123
    kubectl exec -n iam $POD -- /opt/keycloak/bin/kcadm.sh create realms \
      -s realm=taskapi -s enabled=true 2>/dev/null || true
    for GROUP in dev-team ops-team platform-eng readonly; do
      kubectl exec -n iam $POD -- /opt/keycloak/bin/kcadm.sh create groups \
        -r taskapi -s name=$GROUP 2>/dev/null || true
    done
    kubectl exec -n iam $POD -- /opt/keycloak/bin/kcadm.sh create clients \
      -r taskapi -s clientId=kubernetes -s enabled=true \
      -s protocol=openid-connect -s publicClient=false \
      -s secret=kubernetes-client-secret \
      -s directAccessGrantsEnabled=true \
      -s 'redirectUris=["*"]' 2>/dev/null || true
    echo "✅ Keycloak configured"
  changed_when: true

- name: Show Keycloak status
  ansible.builtin.debug:
    msg: "✅ Keycloak deployed and configured via kubectl exec"
