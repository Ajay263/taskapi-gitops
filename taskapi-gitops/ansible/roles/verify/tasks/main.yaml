---
- name: Verify cluster is reachable
  ansible.builtin.command: kubectl cluster-info
  register: verify_cluster
  changed_when: false
  failed_when: verify_cluster.rc != 0

- name: Get nodes
  ansible.builtin.command: kubectl get nodes --no-headers
  register: verify_nodes_raw
  changed_when: false

- name: Verify all nodes Ready
  ansible.builtin.assert:
    that: "'NotReady' not in verify_nodes_raw.stdout"
    fail_msg: "Some nodes are not Ready"

- name: Verify taskapi pod is running
  ansible.builtin.command: >
    kubectl get pods -n taskapi-dev -l app=taskapi --no-headers
  register: verify_taskapi_pods
  changed_when: false
  failed_when: verify_taskapi_pods.stdout == ''

- name: Verify taskapi health via kubectl exec
  ansible.builtin.command: >
    kubectl exec -n taskapi-dev deploy/taskapi
    -- wget -q -O- http://localhost:8000/health
  register: verify_health_raw
  changed_when: false
  retries: 3
  delay: 5

- name: Parse health response
  ansible.builtin.set_fact:
    verify_health: "{{ verify_health_raw.stdout | from_json }}"

- name: Assert app is healthy
  ansible.builtin.assert:
    that: verify_health.status == 'healthy'
    fail_msg: "App health check failed: {{ verify_health }}"

- name: Assert vault secret is injected
  ansible.builtin.assert:
    that: verify_health.checks.vault_secret == 'ok'
    fail_msg: "Vault secret not injected — run vault recovery"

- name: Verify Prometheus is running
  ansible.builtin.command: >
    kubectl get pods -n monitoring
    -l app.kubernetes.io/name=prometheus --no-headers
  register: verify_prom
  changed_when: false
  failed_when: verify_prom.stdout == ''

- name: Verify Grafana is running
  ansible.builtin.command: >
    kubectl get pods -n monitoring
    -l app.kubernetes.io/name=grafana --no-headers
  register: verify_grafana
  changed_when: false
  failed_when: verify_grafana.stdout == ''

- name: Verify ArgoCD is running
  ansible.builtin.command: >
    kubectl get pods -n argocd
    -l app.kubernetes.io/name=argocd-server --no-headers
  register: verify_argocd
  changed_when: false
  failed_when: verify_argocd.stdout == ''

- name: Verify OPA Gatekeeper constraint exists
  ansible.builtin.command: >
    kubectl get requirenonroot require-non-root
  register: verify_constraint
  changed_when: false
  failed_when: false

- name: Print verification summary
  ansible.builtin.debug:
    msg:
      - "✅ Cluster: reachable"
      - "✅ Nodes: {{ verify_nodes_raw.stdout_lines | length }} ready"
      - "✅ TaskAPI: running"
      - "✅ Health: {{ verify_health.status }}"
      - "✅ Vault secret: {{ verify_health.checks.vault_secret }}"
      - "✅ Prometheus: running"
      - "✅ Grafana: running"
      - "✅ ArgoCD: running"
      - "✅ OPA: {{ 'active' if verify_constraint.rc == 0 else 'missing' }}"
