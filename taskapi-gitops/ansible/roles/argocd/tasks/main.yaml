---
- name: Add Argo Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install ArgoCD via Helm
  ansible.builtin.shell: >
    helm upgrade --install argocd argo/argo-cd
    --version {{ argocd_helm_version }}
    --namespace argocd
    --create-namespace
    --set server.service.type=NodePort
    --set server.service.nodePort=30444
    --set redis.enabled=true
    --wait
    --timeout 600s
  register: argocd_helm
  changed_when: "'UPGRADE' in argocd_helm.stdout or 'INSTALL' in argocd_helm.stdout"

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available deployment/argocd-server
    --namespace=argocd --timeout=600s
  changed_when: false

- name: Get ArgoCD admin password
  ansible.builtin.shell: |
    kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  changed_when: false

- name: Show ArgoCD admin password
  ansible.builtin.debug:
    msg: "ArgoCD admin password: {{ argocd_password.stdout }}"

- name: Add GitOps repository to ArgoCD via kubectl secret
  ansible.builtin.shell: |
    kubectl create secret generic argocd-repo-taskapi-gitops       --namespace argocd       --from-literal=type=git       --from-literal=url={{ argocd_repo_url }}       --from-literal=username=Ajay263       --from-literal=password={{ argocd_repo_token }}       --dry-run=client -o yaml |     kubectl label --local -f -       argocd.argoproj.io/secret-type=repository       --dry-run=client -o yaml |     kubectl apply -f -
  changed_when: true
  no_log: true

- name: Show paths for debugging
  ansible.builtin.debug:
    msg:
      - "role_path: {{ role_path }}"
      - "project file exists check path: {{ role_path }}/../../../argocd/projects/taskapi-project.yaml"

- name: Apply ArgoCD AppProject
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../argocd/projects/taskapi-project.yaml
  changed_when: false

- name: Patch AppProject to allow ClusterSecretStore
  ansible.builtin.shell: |
    kubectl patch appproject taskapi -n argocd --type=json -p='"'"'[
      {"op":"add","path":"/spec/clusterResourceWhitelist/-",
       "value":{"group":"external-secrets.io","kind":"ClusterSecretStore"}}
    ]'"'"'
  changed_when: false
  failed_when: false

- name: Apply ArgoCD application
  ansible.builtin.command: >
    kubectl apply -f {{ role_path }}/../../../argocd/apps/taskapi-dev.yaml
  changed_when: false

- name: Show ArgoCD app status
  ansible.builtin.command: >
    kubectl get application taskapi-dev -n argocd
    -o jsonpath="{.status.health.status} {.status.sync.status}"
  register: argocd_app_status
  changed_when: false
  failed_when: false

- name: Display ArgoCD status
  ansible.builtin.debug:
    msg: "ArgoCD taskapi-dev status: {{ argocd_app_status.stdout }}"
