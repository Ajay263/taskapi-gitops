---
- name: Add Argo Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_helm_version }}"
    release_namespace: argocd
    create_namespace: true
    values:
      server:
        service:
          type: NodePort
          nodePort: 30444
      redis:
        enabled: true
    wait: true
    timeout: "300s"

- name: Wait for ArgoCD server
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180

- name: Get ArgoCD admin password
  ansible.builtin.shell: |
    kubectl -n argocd get secret argocd-initial-admin-secret \
      -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  changed_when: false

- name: Start ArgoCD port-forward
  ansible.builtin.shell: |
    pkill -f "port-forward.*argocd.*8443" 2>/dev/null || true
    kubectl port-forward svc/argocd-server -n argocd 8443:443 &
    sleep 5
  changed_when: false

- name: Login to ArgoCD CLI
  ansible.builtin.command: >
    argocd login localhost:8443
    --username admin
    --password "{{ argocd_password.stdout }}"
    --insecure
  changed_when: false

- name: Add GitOps repository to ArgoCD
  ansible.builtin.command: >
    argocd repo add {{ argocd_repo_url }}
    --username Ajay263
    --password {{ argocd_repo_token }}
    --insecure-skip-server-verification
    --upsert
  changed_when: false
  no_log: true

- name: Apply ArgoCD AppProject
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../argocd/projects/taskapi-project.yaml"

- name: Patch AppProject to allow ClusterSecretStore
  kubernetes.core.k8s_json_patch:
    kind: AppProject
    name: taskapi
    namespace: argocd
    patch:
      - op: add
        path: /spec/clusterResourceWhitelist/-
        value:
          group: external-secrets.io
          kind: ClusterSecretStore

- name: Apply ArgoCD application
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../argocd/apps/taskapi-dev.yaml"

- name: Sync ArgoCD app
  ansible.builtin.command: >
    argocd app sync taskapi-dev --insecure
  changed_when: false
  ignore_errors: true

- name: Show ArgoCD status
  ansible.builtin.command: >
    argocd app get taskapi-dev --insecure
  register: argocd_status
  changed_when: false

- name: Display ArgoCD app status
  ansible.builtin.debug:
    msg: "{{ argocd_status.stdout_lines }}"
