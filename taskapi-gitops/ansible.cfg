[defaults]
# Use our local inventory
inventory = inventory/hosts.yaml
# Don't check SSH host keys (we use local kubectl, not SSH)
host_key_checking = False
# Show diffs when files change
diff_always = True
# Retry failed tasks up to 3 times (for Helm timeouts)
stdout_callback = yaml
# Keep vault password in file (CI uses env var)
vault_password_file = .vault_pass

[privilege_escalation]
become = False