apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskapi-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: taskapi
  source:
    repoURL: https://github.com/Ajay263/taskapi-gitops
    targetRevision: HEAD
    path: taskapi-gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: taskapi-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
