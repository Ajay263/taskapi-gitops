# ServiceMonitor tells Prometheus: find Services labelled 'app: taskapi'
# in these namespaces and scrape /metrics every 15 seconds.
#
# CRITICAL: the 'release: kube-prometheus-stack' label MUST match
# the Helm release name exactly. Without it, Prometheus ignores this.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskapi
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: taskapi
spec:
  namespaceSelector:
    matchNames:
      - taskapi-dev
      - taskapi-staging
      - taskapi-prod
  selector:
    matchLabels:
      app: taskapi
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s