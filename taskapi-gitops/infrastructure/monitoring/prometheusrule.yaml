apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskapi-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskapi.availability
      interval: 30s
      rules:
        - alert: TaskAPIDown
          expr: up{job="taskapi"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "TaskAPI is DOWN in {{ $labels.namespace }}"
            description: "Check: kubectl get pods -n {{ $labels.namespace }}"

        - alert: TaskAPIHighErrorRate
          expr: |
            (
              rate(taskapi_requests_total{http_status=~"5.."}[5m])
              /
              rate(taskapi_requests_total[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Error rate > 5% in {{ $labels.namespace }}"

        - alert: TaskAPISlowResponses
          expr: |
            histogram_quantile(0.95,
              sum(rate(taskapi_request_duration_seconds_bucket[5m]))
              by (le, namespace)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency > 500ms in {{ $labels.namespace }}"

        - alert: TaskAPIPodsNotReady
          expr: |
            kube_deployment_status_replicas_ready{deployment="taskapi"}
            < kube_deployment_spec_replicas{deployment="taskapi"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "taskapi has fewer ready pods than desired"