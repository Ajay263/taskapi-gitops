apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: taskapi-slack-alerts
  namespace: monitoring
  labels:
    alertmanagerConfig: taskapi
spec:
  route:
    # All alerts go to Slack by default
    receiver: slack-notifications
    groupBy: [alertname, namespace]
    groupWait: 30s        # Wait 30s before sending first alert (group similar alerts)
    groupInterval: 5m     # Wait 5m before sending new alerts for the same group
    repeatInterval: 4h    # Re-send unresolved alerts every 4 hours
    routes:
      # Critical alerts get sent immediately with no grouping delay
      - matchers:
          - name: severity
            value: critical
        receiver: slack-critical
        groupWait: 0s
        repeatInterval: 1h

  receivers:
    # Default: general Slack channel for warnings
    - name: slack-notifications
      slackConfigs:
        - apiURL:
            name: slack-webhook-secret
            key: webhook-url
          channel: '#alerts'
          sendResolved: true
          title: '{{ template "slack.default.title" . }}'
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Severity:* {{ .Labels.severity }}
            *Namespace:* {{ .Labels.namespace }}
            *Description:* {{ .Annotations.description }}
            *Started:* {{ .StartsAt | since }}
            {{ end }}
          color: '{{ if eq .Status "firing" }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

    # Critical: separate channel with more urgency
    - name: slack-critical
      slackConfigs:
        - apiURL:
            name: slack-webhook-secret
            key: webhook-url
          channel: '#alerts'
          sendResolved: true
          title: '🚨 CRITICAL: {{ template "slack.default.title" . }}'
          text: |
            {{ range .Alerts }}
            *🔥 Alert:* {{ .Annotations.summary }}
            *Namespace:* {{ .Labels.namespace }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* {{ .Annotations.runbook_url }}
            {{ end }}
          color: danger