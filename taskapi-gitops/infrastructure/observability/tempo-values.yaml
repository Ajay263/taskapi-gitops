tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  nodeSelector:
    workload: infra

  # Receive traces via OTLP from the OTel Collector
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

service:
  type: ClusterIP